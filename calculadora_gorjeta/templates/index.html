{% extends "base.html" %}

{% block title %}Novo cálculo • Calculadora de Gorjeta{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h1 class="h3 mb-4">Dividir conta com gorjeta</h1>

          <form method="post" novalidate>
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label" for="valor_conta">Valor total da conta (R$)</label>
                <input
                  class="form-control"
                  id="valor_conta"
                  name="valor_conta"
                  type="number"
                  min="0"
                  step="0.01"
                  placeholder="Ex.: 150.00"
                  required
                  value="{{ form_data.valor_conta }}"
                />
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label" for="quantidade_pessoas">Quantidade de pessoas</label>
                <input
                  class="form-control"
                  id="quantidade_pessoas"
                  name="quantidade_pessoas"
                  type="number"
                  min="1"
                  step="1"
                  placeholder="Ex.: 3"
                  required
                  value="{{ form_data.quantidade_pessoas }}"
                />
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label" for="percentual_gorjeta">Percentual de gorjeta (%)</label>
                <input
                  class="form-control"
                  id="percentual_gorjeta"
                  name="percentual_gorjeta"
                  type="number"
                  min="0"
                  step="0.01"
                  placeholder="Ex.: 10"
                  required
                  value="{{ form_data.percentual_gorjeta }}"
                />
              </div>
            </div>

            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary px-4">Calcular</button>
              <button type="reset" class="btn btn-outline-secondary">Limpar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
